spring:
  application:
    name: datastoria-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql/versioned
    baseline-on-migrate: false
  sql:
    init:
      # Flyway is the only runtime schema owner. ddl.sql/dml.sql are manual deployment helpers
      # and must never be auto-executed alongside migrations.
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  application:
    name: DataStoria Server
    description: Spring Boot backend for DataStoria

datastoria:
  agent:
    # Source repository behind search_file/read_file and the UI code viewer. When the directory
    # does not exist, the first tool use shallow-clones repository-remote into it (10-minute
    # budget); set DATASTORIA_AGENT_REPOSITORY_ROOT to point at an existing checkout instead.
    repository-root: ${DATASTORIA_AGENT_REPOSITORY_ROOT:${user.dir}/data/code-repos/clickhouse}
    repository-remote: ${DATASTORIA_AGENT_REPOSITORY_REMOTE:https://github.com/ClickHouse/ClickHouse.git}
  clickhouse:
    metadata-cache:
      ttl: ${DATASTORIA_CLICKHOUSE_METADATA_CACHE_TTL:PT5M}
      maximum-size: ${DATASTORIA_CLICKHOUSE_METADATA_CACHE_MAXIMUM_SIZE:1000}
    # 普通用户 Query 和 Agent 查询共用的 ClickHouse 服务端安全上限。
    # 请求参数只能把数值调小，不能覆盖或放宽这里的限制；管理员 Query 不应用这些只读限制。
    query-security:
      # 是否强制只读。必须保持 true；服务端会映射为 ClickHouse readonly=2。
      read-only: ${DATASTORIA_QUERY_READ_ONLY:true}
      # 即使 ClickHouse 账号本身拥有 DDL 权限，普通用户和 Agent 仍禁止执行 DDL。
      allow-ddl: ${DATASTORIA_QUERY_ALLOW_DDL:false}
      # 禁止可能访问服务端环境或文件系统信息的 introspection functions。
      allow-introspection-functions: ${DATASTORIA_QUERY_ALLOW_INTROSPECTION_FUNCTIONS:false}
      # 单次查询最长执行秒数。
      max-execution-time: ${DATASTORIA_QUERY_MAX_EXECUTION_TIME:30}
      # 最多返回行数；超出后按 result-overflow-mode 处理。
      max-result-rows: ${DATASTORIA_QUERY_MAX_RESULT_ROWS:10000}
      # 最多返回字节数，默认约 10 MB。
      max-result-bytes: ${DATASTORIA_QUERY_MAX_RESULT_BYTES:10000000}
      # 最多扫描行数；这是约束全表扫描的主要参数之一。
      max-rows-to-read: ${DATASTORIA_QUERY_MAX_ROWS_TO_READ:10000000}
      # 最多读取字节数，默认约 1 GB。
      max-bytes-to-read: ${DATASTORIA_QUERY_MAX_BYTES_TO_READ:1000000000}
      # 单次查询最大内存用量，默认约 1 GB。
      max-memory-usage: ${DATASTORIA_QUERY_MAX_MEMORY_USAGE:1000000000}
      # 单次查询最多使用的 ClickHouse 执行线程数。
      max-threads: ${DATASTORIA_QUERY_MAX_THREADS:4}
      # 返回结果超限时截断结果，避免大结果继续传输。
      result-overflow-mode: break
      # 扫描量超限时直接终止查询，避免继续消耗集群资源。
      read-overflow-mode: throw
  # Base64-encoded 32-byte AES-256 key used to encrypt server-managed credentials at rest.
  # Resolution: DATASTORIA_MASTER_KEY (or the built-in dev-profile default) wins; otherwise a
  # random key is generated into master-key-file on first start. Back the key file up: losing
  # it makes stored credentials unrecoverable. Rotating the active key does not break old data
  # as long as the previous key stays in master-key-legacy.
  master-key: ${DATASTORIA_MASTER_KEY:}
  master-key-file: ${DATASTORIA_MASTER_KEY_FILE:data/master.key}
  # Decrypt-only historical keys (comma-separated base64), oldest first. The two defaults are
  # the keys that were historically hardcoded in this repository, kept so existing dev/prod
  # databases keep decrypting. Set DATASTORIA_MASTER_KEY_LEGACY="" once no stored secret
  # predates the current key.
  master-key-legacy: ${DATASTORIA_MASTER_KEY_LEGACY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=,U8QvzqihXv/MuBOZ4ZFRz7MYpBlUnLQwKiabuH4mG38=}

# Exactly one runtime profile is supported:
#   dev  -> MySQL 5.7 with convenient local defaults and a fixed JWT secret / bootstrap admin
#   prod -> MySQL 5.7 with environment-owned credentials, JWT secret and bootstrap admin
# Both profiles authenticate identically: username + password login issuing a JWT, enforced by
# JwtIdentityWebFilter. They share the same Flyway migrations, MyBatis mappers and
# MysqlAgentStateStore. Running without a profile intentionally fails (no datasource URL).

# MyBatis-Plus configuration shared by dev and prod. No global
# TenantLine/LogicDelete/OptimisticLocker plugins are enabled here: tenant_id, deleted_at and
# revision semantics are implemented explicitly by repository adapters and mapper XML.
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: io.github.ccweixiao.datastoria.dao.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
