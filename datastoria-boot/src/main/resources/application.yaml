spring:
  application:
    name: datastoria-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql/versioned
    baseline-on-migrate: false
  sql:
    init:
      # Flyway is the only runtime schema owner. ddl.sql/dml.sql are manual deployment helpers
      # and must never be auto-executed alongside migrations.
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  application:
    name: DataStoria Server
    description: Spring Boot backend for DataStoria

# Exactly one runtime profile is supported:
#   dev  -> MySQL 5.7 with convenient local defaults and a fixed JWT secret / bootstrap admin
#   prod -> MySQL 5.7 with environment-owned credentials, JWT secret and bootstrap admin
# Both profiles authenticate identically: username + password login issuing a JWT, enforced by
# JwtIdentityWebFilter. They share the same Flyway migrations, MyBatis mappers and
# MysqlAgentStateStore. Running without a profile intentionally fails (no datasource URL).

# MyBatis-Plus configuration shared by dev and prod. No global
# TenantLine/LogicDelete/OptimisticLocker plugins are enabled here: tenant_id, deleted_at and
# revision semantics are implemented explicitly by repository adapters and mapper XML.
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: io.github.ccweixiao.datastoria.dao.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
