# Local development profile. MySQL 5.7 is the only supported database.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/datastoria?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: datastoria
    password: "Datastoria@123456"

datastoria:
  master-key: ${DATASTORIA_MASTER_KEY}
  agent:
    repository-root: ${DATASTORIA_AGENT_REPOSITORY_ROOT:${user.dir}}
  skills:
    seed-enabled: true
  security:
    default-tenant: default
    jwt:
      # Dev-only HS256 secret. Any non-empty string works (it is SHA-256 hashed to 32 bytes).
      # Prod must override via DATASTORIA_JWT_SECRET.
      secret: dev-secret-change-me
      ttl-minutes: 480
    bootstrap-admin:
      username: admin
      password: admin123
      role: ADMIN
      tenant: default
      email: admin@example.com
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
