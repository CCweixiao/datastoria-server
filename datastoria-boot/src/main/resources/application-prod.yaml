# Production profile. Secrets and deployment-specific URLs must be supplied by the environment.
spring:
  datasource:
    url: ${DATASTORIA_DB_URL}
    username: ${DATASTORIA_DB_USERNAME}
    password: ${DATASTORIA_DB_PASSWORD}

datastoria:
  security:
    default-tenant: ${DATASTORIA_DEFAULT_TENANT:default}
    jwt:
      secret: ${DATASTORIA_JWT_SECRET}
      ttl-minutes: ${DATASTORIA_JWT_TTL_MINUTES:480}
    bootstrap-admin:
      username: ${DATASTORIA_BOOTSTRAP_ADMIN_USERNAME:datastoria}
      password: ${DATASTORIA_BOOTSTRAP_ADMIN_PASSWORD}
      role: ${DATASTORIA_BOOTSTRAP_ADMIN_ROLE:ADMIN}
      tenant: ${DATASTORIA_DEFAULT_TENANT:default}
      email: ${DATASTORIA_BOOTSTRAP_ADMIN_EMAIL:}
  cors:
    # Only needed when the frontend is hosted on a different origin; empty (the default) means
    # no cross-origin access is allowed, which is correct for the unified single-process
    # deployment where the browser talks to this process same-origin.
    allowed-origins: ${DATASTORIA_CORS_ALLOWED_ORIGINS:}
