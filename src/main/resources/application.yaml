spring:
  application:
    name: datastoria-server

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  application:
    name: DataStoria Server
    description: Spring Boot backend for DataStoria

# A Spring profile must always be active to wire the datasource:
#   local  -> SQLite file (./data/datastoria.db)
#   test   -> SQLite in-memory
#   prod   -> MySQL (fail-fast on missing env vars)
# Running without a profile intentionally has no datasource.
