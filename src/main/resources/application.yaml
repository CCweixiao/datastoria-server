spring:
  application:
    name: datastoria-server

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  application:
    name: DataStoria Server
    description: Spring Boot backend for DataStoria
