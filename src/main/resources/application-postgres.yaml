# PostgreSQL production compatibility profile.
#
# Required environment variables are identical to the MySQL prod profile:
#   DATASTORIA_DB_URL       e.g. jdbc:postgresql://db:5432/datastoria
#   DATASTORIA_DB_USERNAME
#   DATASTORIA_DB_PASSWORD
#   DATASTORIA_MASTER_KEY

server:
  port: 8080

spring:
  datasource:
    url: ${DATASTORIA_DB_URL}
    username: ${DATASTORIA_DB_USERNAME}
    password: ${DATASTORIA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

datastoria:
  master-key: ${DATASTORIA_MASTER_KEY}
  cors:
    allowed-origins: ${DATASTORIA_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    success-url: ${DATASTORIA_AUTH_SUCCESS_URL:http://localhost:3000}
  identity:
    default-tenant: ${DATASTORIA_DEFAULT_TENANT:tenant-default}
    default-user: ${DATASTORIA_DEFAULT_USER:}
    default-roles: ${DATASTORIA_DEFAULT_ROLES:ROLE_USER}
