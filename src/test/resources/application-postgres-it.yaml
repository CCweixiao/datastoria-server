# PostgreSQL integration-test profile. Testcontainers injects the real JDBC settings.
spring:
  main:
    banner-mode: off
    web-application-type: reactive

  datasource:
    url: "jdbc:postgresql://placeholder/test"
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true

datastoria:
  master-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  identity:
    default-tenant: tenant-postgres-it
    default-user: it@example.com
    default-roles: ROLE_ADMIN,ROLE_USER
