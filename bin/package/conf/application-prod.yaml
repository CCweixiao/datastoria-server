# Secrets and datasource credentials are read from DATASTORIA_* environment variables.
# Put only non-secret production overrides in this file.
spring:
  datasource:
    url: ${DATASTORIA_DB_URL}
    username: ${DATASTORIA_DB_USERNAME}
    password: ${DATASTORIA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: false

datastoria:
  master-key: ${DATASTORIA_MASTER_KEY}
  identity:
    default-tenant: ${DATASTORIA_DEFAULT_TENANT:tenant-default}
    default-user: ${DATASTORIA_DEFAULT_USER:}
    default-roles: ${DATASTORIA_DEFAULT_ROLES:ROLE_USER}
